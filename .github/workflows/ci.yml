name: Amanzi ATS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs for PRs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build # Our build runs tsc

      - name: Linting
        run: npm run lint

  frontend-checks:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Linting
        run: npm run lint

      - name: Build Application
        run: npm run build

  python-worker-checks:
    name: Python Worker Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-worker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements_fixed.txt

  deployment-safety:
    name: Deployment Safety Checks
    needs: [backend-checks, frontend-checks, python-worker-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment Configurations Exist
        run: |
          echo "Checking environment templates..."
          if [ ! -d "./env" ]; then
            echo "Error: 'env' directory missing."
            exit 1
          fi
          if [ ! -f "./env/backend.production.env.example" ]; then
            echo "Error: 'backend.production.env.example' missing."
            exit 1
          fi
          echo "Environment templates are present."

      - name: Prevent Hardcoded Secrets in Configs
        run: |
          echo "Scanning for leaked production secrets..."
          # A simple check to ensure no actual secret overrides the example tokens in VCS
          if grep -q "JWT_SECRET=[a-zA-Z0-9]\{32,\}[^!_]" ./env/backend.production.env.example; then
             echo "Warning: Possible actual secret committed in example file. Please review."
          fi
